# systemd gives this a throwaway user with CAP_KILL + CAP_IPC_LOCK. It stays uid 0 here so
# the recorder hook can reach its 0600 socket; SYS_NICE + SYS_RESOURCE are for -p.
keep_caps=CAP_KILL,CAP_IPC_LOCK,CAP_SYS_NICE,CAP_SYS_RESOURCE
expand_args=0
args=
args=-r
args=0
args=-p
args=-m
args=99,99
args=-s
args=10,5
args=--prefer
args=^(Web Content|Isolated Web Co)$
args=--avoid
args=^(schema-.*|kwin_wayland|kwin_x11|plasmashell|plasma-session-|ksmserver|kded6|Xwayland|Xorg|sddm|sddm-helper|pipewire|pipewire-pulse|wireplumber|dbus-daemon|dbus-broker|polkitd|NetworkManager|tailscaled|sshd|claude|dnf|packagekitd|cryptsetup)$
args=-N
args=/usr/local/bin/schema-recorder-earlyoom
