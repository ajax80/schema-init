# schema-migrate round-trip harness — stock Fedora KDE, LEGACY BIOS (matches Optiplex).
# Consumed by run.sh, which substitutes @@PUBKEY@@ before serving it to anaconda.
# Goal: a faithful stock desktop box to migrate FROM — real BLS entries under a
# BIOS GRUB, real plasma/sddm, uid-1000 primary user, sshd for automated verify.
text
lang en_US.UTF-8
keyboard us
timezone America/Chicago --utc
firstboot --disable
selinux --enforcing

# Legacy BIOS: msdos label, GRUB to the MBR of the (virtio) system disk.
zerombr
clearpart --all --initlabel --disklabel=msdos
part /boot --fstype=ext4 --size=1024 --label=boot
part /     --fstype=ext4 --grow      --label=root
bootloader --location=mbr --boot-drive=vda --append="console=tty0 console=ttyS0,115200"

network --bootproto=dhcp --activate --hostname=optiplex-vm
rootpw --plaintext schemaroot
user --name=tester --uid=1000 --gid=1000 --groups=wheel --password=schema123 --plaintext

# Only sshd via the services directive — enabling a display manager here aborts
# anaconda ("Error enabling service sddm: 1"); sddm is enabled in %post instead.
services --enabled=sshd

%packages
@^kde-desktop-environment
@standard
kernel
grub2-pc
sddm
openssh-server
# schema runtime deps the migrator expects present or dnf-installs:
seatd
pipewire
wireplumber
pipewire-pulseaudio
%end

%post
# Passwordless SSH for the host harness (uid-1000 tester + root).
install -d -m700 /home/tester/.ssh
echo "@@PUBKEY@@" > /home/tester/.ssh/authorized_keys
chmod 600 /home/tester/.ssh/authorized_keys
chown -R tester:tester /home/tester/.ssh
install -d -m700 /root/.ssh
echo "@@PUBKEY@@" > /root/.ssh/authorized_keys
chmod 600 /root/.ssh/authorized_keys
# Serial getty as an eyeball backup on both stock and schema boots.
systemctl enable serial-getty@ttyS0.service || true
# Display manager + graphical target — done here (not via `services`) so a
# non-fatal enable can't abort the install.
systemctl enable sddm.service || true
systemctl set-default graphical.target || true
%end

poweroff
