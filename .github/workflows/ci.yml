name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v5
      - name: deps
        run: >
          dnf -y --disablerepo=fedora-cisco-openh264 install gcc make glibc-static libacl-devel dbus-devel libzstd-devel
          pkgconf-pkg-config python3 python3-dbus python3-gobject python3-pyside6
          acl dbus-daemon rpm-build git util-linux
      - name: unprivileged user
        run: |
          useradd -m ci && chown -R ci "$GITHUB_WORKSPACE"
          install -d -o ci -m 0700 /run/user/$(id -u ci)
      - name: build
        run: su ci -c 'make'
      - name: hardening flags
        run: su ci -c 'make check-hardening'
      - name: unit tests
        run: su ci -c 'make test'
      - name: python suite
        run: su ci -c "XDG_RUNTIME_DIR=/run/user/$(id -u ci) sh .github/ci-python-suite.sh"

  # verify's init= sandbox needs real user + mount namespaces: on the runner, as root,
  # not in the unprivileged container above
  verify-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: hostile init= fixtures
        run: sudo make verify-sandbox-live

  # stage 1 of PID 1 under QEMU: the real binary boots a minimal guest, runs
  # services and powers off through its own shutdown path (tests/qemu-ci/)
  qemu-pid1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 busybox-static cpio
      - name: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: boot schema-init as PID 1
        run: |
          sudo install -m 0644 /boot/vmlinuz-$(uname -r) "$RUNNER_TEMP/vmlinuz"
          KERNEL="$RUNNER_TEMP/vmlinuz" sh tests/qemu-ci/pid1-boot.sh

  # stage 4a: the boot-success guard's fallback under real Fedora GRUB (blscfg, which
  # Ubuntu's GRUB lacks); stage 4b: verify run inside a guest booted through it.
  # A Fedora container on the runner, with its KVM
  grub-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: real GRUB falls back to the snapshot entry; verify judges a real boot layout
        run: |
          docker run --rm --device /dev/kvm -v "$PWD:/src" -w /src registry.fedoraproject.org/fedora:44 sh -ec '
            dnf -y -q --disablerepo=fedora-cisco-openh264 install gcc make glibc-static file cpio busybox \
              grub2-efi-x64-modules grub2-tools-extra edk2-ovmf mtools dosfstools util-linux \
              qemu-system-x86-core kernel-core e2fsprogs fakeroot zstd xz
            export KERNEL=$(ls /lib/modules/*/vmlinuz | head -1)
            sh tests/qemu-ci/grub-fallback.sh
            sh tests/qemu-ci/verify-guest.sh'

  # The C unit tests under ASan + UBSan; leaks off (PID 1's tables live
  # forever). `make test` compiles init.o but never links or runs schema-init,
  # so PID 1's own main loop is not covered here. STATIC_LDFLAGS is emptied
  # for schema-init-pi: there is no static sanitizer runtime.
  sanitize:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v5
      - name: deps
        run: >
          dnf -y --disablerepo=fedora-cisco-openh264 install gcc make glibc-static libacl-devel dbus-devel libzstd-devel
          pkgconf-pkg-config python3 libasan libubsan git util-linux procps-ng diffutils systemd-udev
      - name: unprivileged user
        run: useradd -m ci && chown -R ci "$GITHUB_WORKSPACE"
      - name: make test under sanitizers
        run: >
          su ci -c 'CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
          LDFLAGS="-fsanitize=address,undefined" STATIC_LDFLAGS= ASAN_OPTIONS=detect_leaks=0 make test'

  fuzz:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v5
      - name: deps
        run: dnf -y --disablerepo=fedora-cisco-openh264 install clang compiler-rt make dbus-devel
      - name: fuzz 60s per harness
        run: make fuzz FUZZ_SECONDS=60
      - name: keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: /tmp/schema-fuzz/crash_*
